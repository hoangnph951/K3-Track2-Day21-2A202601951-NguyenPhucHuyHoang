name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/*.dvc"
      - "data/**/*.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      candidate_key: ${{ steps.upload_model.outputs.candidate_key }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Pull training data with DVC
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          dvc remote add --force --default myremote "gs://${CLOUD_BUCKET}/dvc"
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        shell: bash
        run: |
          set -euo pipefail
          accuracy="$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")"
          echo "accuracy=${accuracy}" >> "${GITHUB_OUTPUT}"

      - name: Upload candidate model to Cloud Storage
        id: upload_model
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
          CANDIDATE_KEY: models/candidates/${{ github.sha }}/model.pkl
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          candidate_key = os.environ["CANDIDATE_KEY"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          bucket.blob(candidate_key).upload_from_filename("models/model.pkl")
          print(f"Uploaded candidate to gs://{bucket_name}/{candidate_key}")
          PY
          echo "candidate_key=${CANDIDATE_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Save training outputs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: training-outputs-${{ github.run_number }}
          path: |
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check accuracy gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          EVAL_THRESHOLD: "0.70"
        run: |
          python - <<'PY'
          import os

          accuracy = float(os.environ["ACCURACY"])
          threshold = float(os.environ["EVAL_THRESHOLD"])
          if accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {accuracy:.4f} < {threshold:.2f}. Deployment blocked."
              )
          print(f"PASSED: accuracy {accuracy:.4f} >= {threshold:.2f}.")
          PY

  deploy:
    name: Deploy
    needs: [train, eval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Cloud Storage SDK
        run: pip install google-cloud-storage==2.16.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Promote candidate model
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
          CANDIDATE_KEY: ${{ needs.train.outputs.candidate_key }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          candidate_key = os.environ["CANDIDATE_KEY"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          source = bucket.blob(candidate_key)
          if not source.exists(client):
              raise SystemExit(f"Candidate model does not exist: {candidate_key}")
          bucket.copy_blob(source, bucket, "models/latest/model.pkl")
          print(f"Promoted {candidate_key} to models/latest/model.pkl")
          PY

      - name: Restart inference service and verify health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart mlops-serve
            for attempt in $(seq 1 12); do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed on attempt ${attempt}."
                exit 0
              fi
              echo "Waiting for service (${attempt}/12)..."
              sleep 5
            done
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
